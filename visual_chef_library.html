<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library — Visual Chef Gallery</title>
<style>
  :root {
    --bg: #0f1012; --panel: #17181b; --panel2: #1d1f23; --line: #2a2c31;
    --text: #e8e6e1; --dim: #8d8b86; --accent: #d9b56a; --good: #7fb88a; --warn: #d98b6a;
    --radius: 10px; font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 13px; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(15,16,18,.94); backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header .brand { font-weight: 600; white-space: nowrap; }
  header .brand a { color: var(--dim); text-decoration: none; font-weight: 400; }
  header .brand a:hover { color: var(--text); }
  select, input, button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
           border-radius: 7px; padding: 6px 9px; font: inherit; }
  button { cursor: pointer; } button:hover { border-color: var(--dim); }
  #root-select { max-width: 360px; flex: 1 1 200px; }
  #filter { flex: 1 1 160px; }
  .ro { color: var(--dim); font-size: 11px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
  main { padding: 14px; display: grid; gap: 14px; }
  .notice { color: var(--dim); padding: 30px 6px; }
  .cfg { color: var(--dim); font-size: 12px; }
  .cfg code { color: var(--text); }
  .unit { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .unit-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .unit-head h2 { font-size: 15px; margin: 0; }
  .unit-head .sum { color: var(--dim); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .cut { display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: var(--panel2); border-bottom: 1px solid var(--line); }
  .cut .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .cut .name { font-weight: 600; word-break: break-word; margin: 3px 0; }
  .cut .meta { color: var(--dim); font-size: 12px; }
  .cut .others { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .cut .others span { display: block; }
  .cut .none { color: var(--warn); }
  .cut-play { width: 180px; flex: 0 0 180px; aspect-ratio: 16/9; border-radius: 7px; background: #000 center/cover;
              display: grid; place-items: center; border: 1px solid var(--line); cursor: pointer; }
  .cut-play video { width: 100%; height: 100%; border-radius: 7px; }
  .play-glyph { font-size: 22px; opacity: .85; }
  .stages { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1px; background: var(--line); }
  .stage { background: var(--panel); padding: 10px 12px; cursor: pointer; min-height: 62px; }
  .stage:hover { background: var(--panel2); }
  .stage.open { background: #22252b; box-shadow: inset 0 -2px 0 var(--accent); }
  .stage .sname { font-weight: 600; font-size: 12px; }
  .stage .scount { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .stage.empty .scount { color: #5d5b57; }
  .drawer { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 12px; }
  .group h3 { font-size: 12px; color: var(--dim); margin: 0 0 7px; font-weight: 500; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .tile { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; }
  .tile:hover { border-color: var(--dim); }
  .tile .thumb { aspect-ratio: 16/10; background: #0a0a0b center/cover no-repeat; display: grid; place-items: center; color: var(--dim); font-size: 11px; }
  .tile .tname { padding: 6px 7px 1px; font-size: 11.5px; word-break: break-word; line-height: 1.25; }
  .tile .tmeta { padding: 0 7px 6px; font-size: 11px; color: var(--dim); }
  .cloud { color: #7aa7d9; }
  .loose { padding: 10px 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .loose b { color: var(--text); font-weight: 500; }
  .others-folders { color: var(--dim); font-size: 12px; }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; z-index: 20; place-items: center; padding: 20px; }
  #viewer.open { display: grid; }
  #viewer .box { max-width: 100%; max-height: 100%; display: grid; gap: 8px; }
  #viewer img, #viewer video { max-width: min(1400px, 94vw); max-height: 78vh; border-radius: 8px; background: #000; }
  #viewer .bar { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
  #viewer .bar .vname { color: var(--text); font-weight: 600; margin-right: auto; word-break: break-all; }
  @media (max-width: 700px) { .cut { flex-direction: column; } .cut-play { width: 100%; flex-basis: auto; } }
</style>
</head>
<body>
<header>
  <div class="brand">Library <a href="/">· Gallery</a></div>
  <select id="root-select" title="Library root"></select>
  <button id="add-root" title="Add a folder as a library root">+ Folder</button>
  <input id="filter" placeholder="Filter units…">
  <button id="refresh" title="Re-read the folders now">Refresh</button>
  <span class="ro" title="Nothing here moves, renames or edits files">Read-only · live from folders</span>
</header>
<main id="main"><div class="notice">Loading…</div></main>

<div id="viewer"><div class="box">
  <div id="viewer-media"></div>
  <div class="bar"><span class="vname" id="viewer-name"></span>
    <button id="viewer-reveal">Show in Finder</button>
    <a id="viewer-open" target="_blank"><button>Open raw</button></a>
    <button id="viewer-close">Close (Esc)</button></div>
</div></div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const state = { root: null, data: null, open: {} };
const qs = o => new URLSearchParams(o).toString();
const fmtBytes = b => b >= 1e9 ? (b/1e9).toFixed(1)+' GB' : b >= 1e6 ? (b/1e6).toFixed(0)+' MB' : Math.max(1, Math.round(b/1e3))+' KB';
const fmtDate = t => new Date(t*1000).toISOString().slice(0,10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fileUrl = rel => '/library/file?' + qs({root: state.root, rel});
const thumbUrl = rel => '/library/thumb?' + qs({root: state.root, rel});

async function api(url, opts) {
  const r = await fetch(url, opts); const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

async function loadRoots(select) {
  const { roots } = await api('/api/library/roots');
  const sel = $('#root-select'); sel.innerHTML = '';
  for (const r of roots) { const o = document.createElement('option'); o.value = r; o.textContent = r.split('/').slice(-3).join(' / '); o.title = r; sel.appendChild(o); }
  const fromUrl = new URLSearchParams(location.search).get('root');
  state.root = select || fromUrl || roots[0] || null;
  if (state.root) sel.value = state.root;
  return roots;
}

async function loadOverview(fresh) {
  const main = $('#main');
  if (!state.root) { main.innerHTML = '<div class="notice">No library root yet. Click <b>+ Folder</b> and paste the path of a project folder (for example a client programme folder on the shared Drive).</div>'; return; }
  main.innerHTML = '<div class="notice">Reading folders…</div>';
  try { state.data = await api('/api/library?' + qs({root: state.root, ...(fresh ? {fresh: 1} : {})})); }
  catch (e) { main.innerHTML = `<div class="notice">Could not read this folder: ${esc(e.message)}</div>`; return; }
  history.replaceState(null, '', '/library?' + qs({root: state.root}));
  render();
}

function render() {
  const d = state.data, f = $('#filter').value.trim().toLowerCase(), main = $('#main');
  main.innerHTML = '';
  const cfg = document.createElement('div'); cfg.className = 'cfg';
  cfg.innerHTML = d.config.error ? `⚠ ${esc(d.config.error)}` :
    d.config.file ? `Rules from <code>LIBRARY.json</code> in this folder · latest cut checks: <code>${esc((d.config.full_cut.folders||[]).join(' → ') || 'deliverables stage')}</code>`
                  : `No <code>LIBRARY.json</code> here — latest cut = newest video in each unit's deliverables stage.`;
  main.appendChild(cfg);
  const units = d.units.filter(u => !f || u.name.toLowerCase().includes(f));
  if (!units.length) main.insertAdjacentHTML('beforeend', '<div class="notice">No units found. A unit is any folder containing numbered stage folders like <code>01_Ingest</code>, <code>04_Deliverables</code>.</div>');
  for (const u of units) main.appendChild(renderUnit(u));
  if (d.other_folders.length) {
    const o = document.createElement('div'); o.className = 'others-folders';
    o.innerHTML = 'Other folders here (not units): ' + d.other_folders.map(x => `<a href="#" data-rel="${esc(x.rel)}">${esc(x.name)}</a>`).join(' · ');
    o.querySelectorAll('a').forEach(a => a.onclick = ev => { ev.preventDefault(); openLooseFolder(a.dataset.rel, a.textContent); });
    main.appendChild(o);
  }
}

function renderUnit(u) {
  const el = document.createElement('section'); el.className = 'unit';
  const total = u.stages.reduce((a, s) => a + s.count, 0), bytes = u.stages.reduce((a, s) => a + s.bytes, 0);
  el.innerHTML = `<div class="unit-head"><h2>${esc(u.name)}</h2><span class="sum">${total} files · ${fmtBytes(bytes)}</span></div>`;
  const c = u.latest_cut, cut = document.createElement('div'); cut.className = 'cut';
  if (c) {
    const when = c.name_date ? `dated ${c.name_date} (from name)` : `modified ${fmtDate(c.modified)}`;
    cut.innerHTML = `<div class="cut-play" title="Play (downloads if not local)"><span class="play-glyph">▶</span></div>
      <div><div class="label">Latest full cut</div><div class="name">${esc(c.name)}</div>
      <div class="meta">${esc(c.source_folder)} · ${fmtBytes(c.bytes)} · ${when} · ${c.local ? 'on this Mac' : '<span class="cloud">in cloud — plays after download</span>'}</div>
      ${c.others.length ? `<div class="others">Earlier in the same folder:${c.others.map(o => `<span>${esc(o.name)}${o.name_date ? ' · ' + o.name_date : ''}</span>`).join('')}</div>` : ''}</div>`;
    $('.cut-play', cut).onclick = () => openViewer(c.rel, c.name, 'video');
  } else {
    cut.innerHTML = `<div><div class="label">Latest full cut</div><div class="name none">None found</div><div class="meta">No video in the configured cut folders for this unit.</div></div>`;
  }
  el.appendChild(cut);
  const grid = document.createElement('div'); grid.className = 'stages';
  const drawer = document.createElement('div'); drawer.className = 'drawer'; drawer.hidden = true;
  for (const s of u.stages) {
    const st = document.createElement('div'); st.className = 'stage' + (s.count ? '' : ' empty');
    const kinds = Object.entries(s.kinds).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, n]) => `${n} ${k}`).join(' · ');
    st.innerHTML = `<div class="sname">${esc(s.name)}</div><div class="scount">${s.count ? kinds + (s.truncated ? ' +' : '') : 'empty'}</div>`;
    st.onclick = () => toggleStage(u, s, st, grid, drawer);
    grid.appendChild(st);
  }
  el.appendChild(grid); el.appendChild(drawer);
  const loose = u.loose.filter(x => x.kind === 'video' || x.kind === 'project');
  if (loose.length) {
    const l = document.createElement('div'); l.className = 'loose';
    l.innerHTML = `Loose in the ${esc(u.name)} folder (outside stages): ` + loose.map(x => `<b>${esc(x.name)}</b>`).join(' · ');
    el.appendChild(l);
  }
  return el;
}

async function toggleStage(u, s, st, grid, drawer) {
  const wasOpen = st.classList.contains('open');
  grid.querySelectorAll('.stage').forEach(x => x.classList.remove('open'));
  if (wasOpen) { drawer.hidden = true; drawer.innerHTML = ''; return; }
  st.classList.add('open'); drawer.hidden = false; drawer.innerHTML = '<div class="cfg">Reading…</div>';
  await fillDrawer(drawer, s.rel);
}

async function fillDrawer(drawer, rel) {
  let d; try { d = await api('/api/library/folder?' + qs({root: state.root, rel})); }
  catch (e) { drawer.innerHTML = `<div class="cfg">${esc(e.message)}</div>`; return; }
  drawer.innerHTML = d.count ? '' : '<div class="cfg">Empty.</div>';
  for (const g of d.groups) {
    const box = document.createElement('div'); box.className = 'group';
    box.innerHTML = `<h3>${esc(g.group || '(top level)')} · ${g.files.length}</h3><div class="tiles"></div>`;
    const tiles = $('.tiles', box);
    for (const file of g.files) tiles.appendChild(tile(file));
    drawer.appendChild(box);
  }
  if (d.truncated) drawer.insertAdjacentHTML('beforeend', '<div class="cfg">List truncated — very large folder.</div>');
  lazyThumbs(drawer);
}

async function openLooseFolder(rel, name) {
  const main = $('#main'); const sec = document.createElement('section'); sec.className = 'unit';
  sec.innerHTML = `<div class="unit-head"><h2>${esc(name)}</h2><span class="sum">folder</span></div>`;
  const drawer = document.createElement('div'); drawer.className = 'drawer'; sec.appendChild(drawer);
  main.appendChild(sec); sec.scrollIntoView({behavior: 'smooth'});
  await fillDrawer(drawer, rel);
}

const ICON = { video: '▶ video', audio: '♪ audio', project: '◆ project', doc: '≡ doc', other: '· file' };
function tile(f) {
  const t = document.createElement('div'); t.className = 'tile'; t.title = f.rel;
  const isImg = f.kind === 'image';
  t.innerHTML = `<div class="thumb" ${isImg && f.local ? `data-thumb="${esc(f.rel)}"` : ''}>${isImg ? (f.local ? '' : '<span class="cloud">☁ image</span>') : ICON[f.kind]}</div>
    <div class="tname">${esc(f.name)}</div><div class="tmeta">${fmtBytes(f.bytes)} · ${f.name_date || fmtDate(f.modified)}${f.local ? '' : ' · <span class="cloud">cloud</span>'}</div>`;
  t.onclick = () => (f.kind === 'image' || f.kind === 'video') ? openViewer(f.rel, f.name, f.kind) : reveal(f.rel);
  return t;
}

const io = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) {
    const el = e.target; io.unobserve(el);
    el.style.backgroundImage = `url("${thumbUrl(el.dataset.thumb)}")`;
  }
}, { rootMargin: '300px' });
function lazyThumbs(scope) { scope.querySelectorAll('[data-thumb]').forEach(el => io.observe(el)); }

function openViewer(rel, name, kind) {
  const m = $('#viewer-media'); const url = fileUrl(rel);
  m.innerHTML = kind === 'video' ? `<video src="${url}" controls autoplay playsinline></video>` : `<img src="${url}" alt="">`;
  $('#viewer-name').textContent = name; $('#viewer-open').href = url;
  $('#viewer-reveal').onclick = () => reveal(rel);
  $('#viewer').classList.add('open');
}
function closeViewer() { $('#viewer').classList.remove('open'); $('#viewer-media').innerHTML = ''; }
async function reveal(rel) { try { await api('/api/library/reveal', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({root: state.root, rel})}); } catch (e) { alert(e.message); } }

$('#viewer-close').onclick = closeViewer;
$('#viewer').onclick = e => { if (e.target.id === 'viewer') closeViewer(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });
$('#filter').oninput = () => state.data && render();
$('#refresh').onclick = () => loadOverview(true);
$('#root-select').onchange = e => { state.root = e.target.value; loadOverview(); };
$('#add-root').onclick = async () => {
  const p = prompt('Absolute path of a project folder to add as a library root:'); if (!p) return;
  try { await api('/api/library/roots', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path: p.trim()})}); await loadRoots(p.trim()); loadOverview(); }
  catch (e) { alert(e.message); }
};

loadRoots().then(() => loadOverview());
</script>
</body>
</html>
